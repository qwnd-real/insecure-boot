[workspace]
members = ["crates/ib-loader", "crates/ib-tpm-crb", "crates/ib-uacpi", "crates/uacpi-sys"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
uefi = { version = "0.40.0", default-features = false, features = [
    "alloc",
    "global_allocator",
    "panic_handler",
] }
x86_64 = { version = "0.15.5", default-features = false, features = ["instructions"] }
bitflags = { version = "2.13.1", default-features = false }
thiserror = { version = "2.0.20", default-features = false }

ib-tpm-crb = { path = "crates/ib-tpm-crb" }
ib-uacpi = { path = "crates/ib-uacpi" }
uacpi-sys = { path = "crates/uacpi-sys" }

bindgen = { version = "0.72.1", default-features = false, features = ["runtime"] }
cc = "1.4.4"

[workspace.lints.rust]
warnings = "deny"
missing_docs = "deny"

# `pedantic` is a group, so it needs a lower priority than the individual lints
# below to keep Cargo from rejecting the table on a future overlap.
[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
allow_attributes_without_reason = "deny"
